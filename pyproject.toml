[tool.poetry]
name = "license-plate-verification"
version = "0.1.0"
description = "Insurance Vehicle Plate Verification App using Streamlit, OpenCV, and OCR"
authors = ["Umberto Altieri"]
readme = "README.md"

[tool.poetry.dependencies]
# Keep Python on 3.11.x for best wheel coverage
python = ">=3.11,<3.12"

# Core
streamlit = ">=1.26.0"
opencv-python-headless = ">=4.7.0"
numpy = ">=1.24.0"
pandas = ">=2.0.0"
pillow = ">=10.0.0"

# DL & OCR
torch = ">=2.2.0"
torchvision = ">=0.17.0"
ultralytics = ">=8.0.0"
paddlepaddle = ">=2.6.0"
paddleocr = ">=2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.3.0"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
