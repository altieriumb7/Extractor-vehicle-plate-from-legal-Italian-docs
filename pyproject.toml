[tool.poetry]
name = "license-plate-verification"
version = "0.1.0"
description = "Insurance Vehicle Plate Verification App using Streamlit, OpenCV, and OCR"
authors = ["Umberto Altieri"]
readme = "README.md"

[tool.poetry.dependencies]
# Keep to 3.11.x — avoids manylinux / wheel gaps you’ll hit on 3.12
python = ">=3.11,<3.12"

# Core
streamlit = ">=1.26,<2.0"
opencv-python-headless = ">=4.7,<5.0"
numpy = ">=1.24,<2.0"
pandas = ">=2.0,<2.2"
pillow = ">=10,<11"

# DL & OCR
torch = "==2.2.2"
torchvision = "==0.17.2"
ultralytics = ">=8.0,<8.2"
paddlepaddle = "==2.6.1"
paddleocr = ">=2.6,<2.7"

# Optional utilities
# tqdm = ">=4.65,<5.0"
# python-Levenshtein = ">=0.21,<0.26"
# matplotlib = ">=3.7,<3.9"
# scipy = ">=1.11,<1.12"

[tool.poetry.group.dev.dependencies]
pytest = ">=7,<9"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

# Optional wrapper entrypoint
[tool.poetry.scripts]
app = "app:main"
